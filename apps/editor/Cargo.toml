[package]
name = "editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "editor"
path = "src/main.rs"

[lib]
name = "editor"
path = "src/lib.rs"

[dependencies]
editor-services = { path = "../../crates/editor-services" }
gpui-kit = { version = "=0.9.0", features = ["syntect"] }
ropey.workspace = true
crossbeam-channel = "=0.5.17"
regex = "1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["syntect", "test-support"] }
tempfile = "=3.27.0"
