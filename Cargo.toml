[workspace]
members = ["crates/editor-services", "apps/editor"]
exclude = ["spikes/nsh-eval"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
ropey = "=2.0.0-beta.1"

[profile.release]
lto = "thin"
codegen-units = 1
