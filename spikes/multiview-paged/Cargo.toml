[package]
name = "multiview-paged"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
publish = false

[workspace]
resolver = "2"

[[bin]]
name = "multiview-paged"
path = "src/main.rs"

[lib]
name = "multiview_paged"
path = "src/lib.rs"

[dependencies]
editor-services = { path = "../../crates/editor-services" }
editor = { path = "../../apps/editor" }
gpui-kit = { version = "=0.9.0", features = ["syntect"] }
ropey = "=2.0.0-beta.1"
crossbeam-channel = "=0.5.17"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
